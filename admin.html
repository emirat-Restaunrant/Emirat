<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Админка — Ресторан Emirat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314110c'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='30' font-weight='700' fill='%23d6a74e' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
:root{--bg:#14110c;--s1:#1d1912;--s2:#282218;--line:#3b3224;--text:#f6efe2;--muted:#b5a88f;--acc:#d6a74e;--ok:#3ad07f;--red:#ff6b6b;--wa:#1fae5b}
body{background:var(--bg);color:var(--text);font:400 15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;font-size:16px;padding:10px 12px;min-width:0}
textarea{resize:vertical;line-height:1.45;font-size:14.5px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc)}
.fld{display:grid;gap:5px;font-size:13px;color:var(--muted);margin-bottom:10px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.fld{flex:1;min-width:120px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 15px;border-radius:12px;font-weight:700;font-size:14px;background:var(--s2);border:1px solid var(--line)}
.btn.p{background:var(--acc);color:#16181d;border-color:var(--acc)}
.btn.s{height:34px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.g{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.r{color:var(--red)}
.gate{max-width:380px;margin:12vh auto 0;padding:0 18px;text-align:center}
.gate h1{font-size:24px;margin:14px 0 6px}
.gate p{color:var(--muted);margin-bottom:18px}
.gate .fld{text-align:left}
.gate .btn{width:100%}
.mark{width:54px;height:54px;border-radius:15px;background:#1f2229;margin:0 auto;position:relative;overflow:hidden;border:1px solid #3a3f4a}
.mark:before,.mark:after{content:"";position:absolute;background:#fff3d6;box-shadow:0 0 8px 2px rgba(255,236,190,.6);border-radius:2px}
.mark:before{left:12px;right:12px;top:16px;height:3px}.mark:after{left:12px;top:16px;bottom:12px;width:3px}
.bar{position:sticky;top:0;z-index:10;background:rgba(14,15,18,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:8px;height:56px}
.bar-in b{margin-right:auto;font-size:17px}
.sv{font-size:12.5px;color:var(--muted)}.sv.ok{color:var(--ok)}.sv.err{color:var(--red)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;max-width:900px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:36px;padding:0 13px;border-radius:99px;background:var(--s1);border:1px solid var(--line);font-size:14px;position:relative}
.tabs button[aria-selected=true]{background:var(--text);color:#16181d;font-weight:700}
.dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center}
h2.t{font-size:21px;margin:18px 0 12px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h3.c{font-size:16px;margin-bottom:10px}
.note{background:rgba(58,208,127,.1);border:1px solid rgba(58,208,127,.35);color:#bff0d2;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{height:32px;padding:0 12px;border-radius:99px;background:var(--s1);border:1px solid var(--line);font-size:13px}
.chips button[aria-pressed=true]{background:var(--acc);color:#16181d;border-color:var(--acc);font-weight:700}
.ord{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.ord.new{border-color:rgba(255,217,138,.6)}
.oh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.oh b{font-size:16px}
.bdg{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--s2)}
.bdg.calc{background:rgba(255,217,138,.15);color:var(--acc)}.bdg.zamer{background:rgba(58,208,127,.15);color:var(--ok)}
.oh time{margin-left:auto;color:var(--muted);font-size:12.5px}
.ord ul{list-style:none;margin:8px 0;font-size:14px;display:grid;gap:3px}
.ord li span{color:var(--muted)}
.st{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.st button{height:32px;padding:0 10px;border-radius:9px;background:var(--s2);font-size:12.5px}
.st button[aria-pressed=true]{background:var(--text);color:#16181d;font-weight:700}
.st .del{margin-left:auto;background:rgba(255,90,90,.12);color:#ff8f8f;border:1px solid rgba(255,90,90,.35)}
.bell{background:rgba(255,217,138,.1);border:1px solid rgba(255,217,138,.45);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;font-size:13.5px}
.bell span{flex:1}
.rep{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.rep .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rep input[type=date]{height:38px;padding:0 10px;border-radius:10px;background:var(--s2);border:1px solid var(--line);color:inherit;font:inherit}
.rep .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rep .sum div{background:var(--s2);border-radius:10px;padding:8px 10px;font-size:12px;color:var(--muted)}
.rep .sum b{display:block;font-size:17px;color:var(--text)}
.it{display:grid;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.it .row input{flex:1}
.sw{display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer;font-size:14.5px}
.sw input{width:20px;height:20px;accent-color:var(--acc)}
.ph{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.ph{grid-template-columns:repeat(3,1fr)}}
.phc{background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.phc.hero{border-color:var(--acc)}
.phc img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.phc .b{padding:8px;display:grid;gap:6px}
.phc .b input{font-size:13px;padding:7px 9px}
.phc .row{gap:4px}
.phc .row button{flex:1;height:30px;border-radius:8px;background:var(--s2);font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:var(--text);color:#16181d;font-weight:700;padding:11px 16px;border-radius:12px;transition:transform .25s;z-index:30;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%)}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:11.5px;color:var(--muted);padding:2px 0}
.cal button{aspect-ratio:1;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:700;display:grid;place-items:center;position:relative;line-height:1.1}
.cal button small{display:block;font-size:9.5px;font-weight:500;color:var(--muted)}
.cal button.busy{background:rgba(255,107,107,.16);border-color:rgba(255,107,107,.55);color:#ffb3b3}
.cal button.busy small{color:#ffb3b3}
.cal button.past{opacity:.35}
.cal button.today{outline:2px solid var(--acc)}
.cal button i{position:absolute;top:3px;right:4px;min-width:15px;height:15px;border-radius:8px;background:var(--acc);color:#16181d;font-size:10px;font-style:normal;display:grid;place-items:center;padding:0 3px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calh b{font-size:16px;text-transform:capitalize}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.lg span{display:flex;align-items:center;gap:6px}.lg i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);display:inline-block}
.wk{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.wk label{display:flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:13px;cursor:pointer}
.wk input{width:16px;height:16px;accent-color:var(--acc)}
.phc img{aspect-ratio:4/3}
.phc select{font-size:13px;padding:7px 9px}
.poster{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.poster img{width:70px;height:94px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
/* меню, банкет, смета, клиенты, статистика */
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tb input{flex:1;min-width:160px}
.dish{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.dish.off,.it.off{opacity:.55}
.th{width:72px;height:72px;border-radius:10px;background:var(--s2);border:1px dashed var(--line);display:grid;place-items:center;font-size:22px;overflow:hidden;padding:0}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.dish .f{display:grid;gap:6px;min-width:0}
.dish .row>*{flex:1;min-width:0}
.dish input,.dish select,.dish textarea,.it input,.it select{font-size:14px;padding:8px 10px}
.fl2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tg{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:99px;background:var(--s2);border:1px solid var(--line);font-size:12.5px;cursor:pointer;color:var(--text)}
.tg input{width:15px;height:15px;accent-color:var(--acc);padding:0}
.mini{display:inline-flex;gap:4px;margin-left:auto}
.mini button{min-width:32px;height:30px;border-radius:8px;background:var(--s2);font-size:13px;padding:0 6px}
.row .price-inp,.price-inp{flex:0 0 112px!important;max-width:112px}
.dish .row{flex-wrap:nowrap}
@media(min-width:640px){.dish{grid-template-columns:96px minmax(0,1fr)}.dish .th{width:96px;height:96px}}
details.more{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;color:var(--acc);font-weight:700;font-size:14px}
.qrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.qrow:last-child{border-bottom:0}
.qrow .n{flex:1;min-width:0}
.qrow .n small{display:block;color:var(--muted);font-size:12px}
.qrow .pr{white-space:nowrap;color:var(--muted);font-size:13px}
.qrow>b{white-space:nowrap}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.stp button{width:32px;height:32px;background:var(--s2);font-size:17px;font-weight:700}
.stp b{min-width:30px;text-align:center;font-size:14px}
.qsum{position:sticky;bottom:10px;z-index:5;background:var(--s2);border:1px solid var(--acc);border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px -10px #000;margin-top:4px}
.qsum .tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.qsum .tot b{font-size:24px;color:var(--acc)}
.qsum .row{margin-top:10px}
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media(min-width:640px){.kpi{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi div{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-size:22px;color:var(--text)}
.hb{display:grid;grid-template-columns:minmax(90px,34%) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;margin-bottom:7px}
.hb span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{height:12px;border-radius:6px;background:var(--bg);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:6px;background:var(--acc)}
.up{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.up:last-child{border-bottom:0}
.up small{display:block;color:var(--muted);font-size:12px}
.up .dt{font-weight:700;min-width:78px}
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <img src="img/logo.webp" alt="Emirat" width="92" style="display:block;margin:0 auto">
  <h1>Админка Emirat</h1>
  <p>Введите пароль администратора.</p>
  <label class="fld">Пароль <span class="muted">вводите английскими буквами</span><input id="gPass" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
  <button class="btn p" id="gateBtn" type="button">Войти</button>
  <p style="margin-top:16px"><a href="index.html">← вернуться на сайт</a></p>
</div>

<div id="app" hidden>
  <header class="bar">
    <div class="wrap bar-in"><b>Админка Emirat</b><span class="sv" id="sv"></span><button class="btn s" id="bellBtn" title="Уведомления в Telegram">🔔</button><a class="btn s" href="index.html" target="_blank" rel="noopener">Сайт ↗</a><button class="btn s" id="exit">Выйти</button></div>
    <nav class="tabs" id="tabs">
      <button data-tab="orders" aria-selected="true">Заявки<span class="dot" id="dot" hidden></span></button>
      <button data-tab="dates" aria-selected="false">Даты</button>
      <button data-tab="quote" aria-selected="false">Смета</button>
      <button data-tab="dishes" aria-selected="false">Меню</button>
      <button data-tab="banquet" aria-selected="false">Банкет и услуги</button>
      <button data-tab="corp" aria-selected="false">Корпоративы</button>
      <button data-tab="clients" aria-selected="false">Клиенты</button>
      <button data-tab="stats" aria-selected="false">Статистика</button>
      <button data-tab="photos" aria-selected="false">Фото</button>
      <button data-tab="texts" aria-selected="false">Тексты и акции</button>
      <button data-tab="settings" aria-selected="false">Настройки</button>
      <button data-tab="admin" aria-selected="false">Админка</button>
    </nav>
  </header>
  <main class="wrap" id="view" style="padding-bottom:40px"></main>
</div>
<input type="file" id="files" accept="image/*" multiple hidden>
<input type="file" id="pfile" accept="image/*" hidden>
<input type="file" id="dfile" accept="image/*" hidden>
<input type="file" id="bkfile" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status"></div>

<script src="js/store.js?v=2"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var esc=function(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var money=function(n){return String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' ₸';};
function toast(t){var el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('on');},2600);}
function getPath(o,p){return p.split('.').reduce(function(a,k){return a==null?a:a[k];},o);}
function setPath(o,p,v){var a=p.split('.');for(var i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v;}
var D=null, tab='orders', orders=[], oSt='all', timer=null, seen=JSON.parse(localStorage.getItem('emirat_seen')||'[]');
var MON=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function today(){return new Date(Date.now()+5*36e5).toISOString().slice(0,10);}
function dnice(v){if(!v)return '';var p=String(v).split('-');return (+p[2])+' '+MG[+p[1]-1];}
function dayKey(d){var x=new Date(d);return x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)+'-'+('0'+x.getDate()).slice(-2);}
var WDL=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'],WDS=['вс','пн','вт','ср','чт','пт','сб'];
function dwd(v){var p=String(v).split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay();}
function dlong(v){if(!v)return '';return dnice(v)+' '+String(v).slice(0,4)+', '+WDL[dwd(v)];}
function addDays(v,n){var p=String(v).split('-');return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n)).toISOString().slice(0,10);}
function waNum(p){var d=String(p||'').replace(/\D/g,'');if(d.length===11&&d[0]==='8')d='7'+d.slice(1);if(d.length===10)d='7'+d;return d;}
function download(name,text,type){var b=new Blob([text],{type:type||'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},800);}
function copyText(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);return new Promise(function(ok,no){var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')?ok():no(new Error('нет доступа'));}catch(e){no(e);}a.remove();});}
/* фото на сервере удаляем, только если оно больше нигде не используется */
function imgRefs(id){id=String(id);var n=0;D.dishes.items.forEach(function(x){if(String(x.img)===id)n++;});D.photos.forEach(function(x){if(String(x.img)===id)n++;});D.corp.variants.forEach(function(v){if(String(v.poster)===id)n++;});return n;}
function dropImg(id){if(/^\d+$/.test(String(id))&&!imgRefs(id))Store.removeImg(id).catch(function(){});}
var dCat='all',dQ='',cQ='',oQ='',stP='90',dIdx=-1;

/* вход */
function gate(){ $('#app').hidden=true; $('#gate').hidden=false; $('#gPass').focus(); }
function login(){
  var p=$('#gPass').value.trim(); if(!p) return toast('Введите пароль');
  $('#gateBtn').disabled=true;
  Store.login(p).then(boot).catch(function(e){toast(e.status===401?'Неверный пароль. Проверьте английскую раскладку':'Нет связи: '+e.message);}).then(function(){$('#gateBtn').disabled=false;});
}
$('#gateBtn').onclick=login;
$('#gPass').addEventListener('keydown',function(e){if(e.key==='Enter')login();});
$('#exit').onclick=function(){Store.logout();location.reload();};
function boot(){
  $('#gate').hidden=true; $('#app').hidden=false;
  Store.load(true).then(function(d){D=d;render();}).catch(function(e){toast('Не загрузилось: '+e.message);});
}
if(Store.authed()) boot(); else gate();

/* сохранение */
var saveT=null;
function sv(s){var el=$('#sv');el.className='sv '+s;el.textContent=s==='ok'?'✓ сохранено':s==='err'?'⚠ не сохранено':'сохраняю…';}
function touch(){ sv('busy'); clearTimeout(saveT); saveT=setTimeout(function(){ Store.save(D).then(function(){sv('ok');}).catch(function(e){sv('err');toast('Не сохранилось: '+e.message);}); },600); }

/* вкладки */
$('#tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab);});
function go(t){tab=t;[].forEach.call($('#tabs').children,function(x){x.setAttribute('aria-selected',x.dataset.tab===t);});render();window.scrollTo(0,0);}
function render(){
  clearInterval(timer); timer=null;
  ({orders:vOrders,dates:vDates,quote:vQuote,dishes:vDishes,banquet:vBanquet,corp:vCorp,clients:vClients,stats:vStats,photos:vPhotos,texts:vTexts,settings:vSettings,admin:vAdmin})[tab]();
}

function fixQ(q){q=q&&typeof q==='object'?q:{};['name','phone','date','time','type','menu','lines','note','order'].forEach(function(k){q[k]=q[k]==null?'':String(q[k]);});
  q.guests=+q.guests||0;q.price=+q.price||0;q.pct=+q.pct||0;q.disc=+q.disc||0;q.pre=+q.pre||0;q.xq=q.xq&&typeof q.xq==='object'?q.xq:{};return q;}

if(!Q.guests)Q.guests=50;
function saveQ(){try{localStorage.setItem(QK,JSON.stringify(Q));}catch(e){}}
function qMenus(){
  var r=[['','— без меню —',0,'']];
  D.corp.variants.forEach(function(v,i){r.push(['c'+i,'Корпоратив · меню '+(i+1)+' — '+money(v.price),v.price,'Корпоратив, меню '+(i+1)]);});
  D.banquet.packs.forEach(function(p,i){r.push(['b'+p.id,(p.n||'Банкетное меню '+(i+1))+' — '+money(p.p),p.p,p.n||'Банкетное меню '+(i+1)]);});
  r.push(['custom','Своя цена за гостя',Q.price,'Меню']);return r;
}
function qMenu(){var l=qMenus();return l.filter(function(m){return m[0]===Q.menu;})[0]||l[0];}
function qItem(k){var id=k.slice(2),l=k[0]==='d'?D.dishes.items:D.services;return l.filter(function(x){return x.id===id;})[0]||null;}
function qCalc(){
  var g=Math.max(0,+Q.guests||0),m=qMenu(),mp=Q.menu==='custom'?(+Q.price||0):m[2],rows=[],sub=mp*g;
  Object.keys(Q.xq).forEach(function(k){var q=+Q.xq[k]||0,x=q>0?qItem(k):null;if(!x)return;
    var per=k[0]==='d'?'pcs':x.per,s=per==='guest'?x.p*g*q:x.p*q;rows.push({k:k,n:x.n||'Без названия',q:q,p:x.p,per:per,sum:s});sub+=s;});
  String(Q.lines||'').split('\n').forEach(function(l){if(!l.trim())return;var p=l.split('|').map(function(s){return s.trim();}),pr=+String(p[1]||'').replace(/\D/g,'')||0,q=+String(p[2]||'').replace(/\D/g,'')||1;rows.push({k:'',n:p[0]||'Без названия',q:q,p:pr,per:'pcs',sum:pr*q});sub+=pr*q;});
  var disc=Math.min(sub,Math.round(sub*(+Q.pct||0)/100)+(+Q.disc||0)),tot=sub-disc,pre=+Q.pre||0;
  return {g:g,m:m,mp:mp,menuSum:mp*g,rows:rows,sub:sub,disc:disc,tot:tot,pre:pre,rest:Math.max(0,tot-pre)};
}

function quoteFrom(o){
  if((Q.name||Q.phone||Object.keys(Q.xq).length)&&!confirm('Заменить текущую смету новыми данными?'))return;

  var mn=String(o.menu_name||o.menu||'');
  D.corp.variants.forEach(function(v,i){if(/Корпоратив/.test(mn)&&+o.price===v.price)Q.menu='c'+i;});
  D.banquet.packs.forEach(function(p){if(p.n&&mn.indexOf(p.n)>=0)Q.menu='b'+p.id;});

function clientsList(){
  var m={};
  orders.forEach(function(o){var d=waNum(o.phone);if(!d)return;var k=d.slice(-10);
    var c=m[k]||(m[k]={phone:o.phone,name:'',n:0,ok:0,cancel:0,guests:0,sum:0,last:'',lastAt:'',types:{}});
    c.n++;if(o.status==='ok'||o.status==='done'){c.ok++;c.guests+=+o.guests||0;c.sum+=+o.total||0;}if(o.status==='cancel')c.cancel++;
    if(!c.lastAt||o.created_at>c.lastAt){c.lastAt=o.created_at;c.name=o.name||c.name;c.phone=o.phone||c.phone;}
    if(o.date&&o.date>c.last)c.last=o.date;if(o.type)c.types[o.type]=1;});
  return Object.keys(m).map(function(k){return m[k];}).sort(function(a,b){return a.lastAt<b.lastAt?1:-1;});
}

function compress(file){
  return new Promise(function(res,rej){
    var img=new Image(), u=URL.createObjectURL(file);
    img.onload=function(){var s=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error('не удалось сжать'));},'image/jpeg',0.82);};
    img.onerror=function(){rej(new Error('не картинка'));}; img.src=u;
  });
}

  else if(el.id==='cs'){cQ=el.value;paintClients();}
  else if(el.dataset.cat!==undefined){var ci=+el.dataset.cat,ds=D.dishes,old=ds.cats[ci],nv=el.value;ds.items.forEach(function(x){if(x.cat===old)x.cat=nv;});if(dCat===old)dCat=nv;ds.cats[ci]=nv;touch();paintDishes();}
  else if(el.dataset.blocks){var ks=el.dataset.keys.split(',');setPath(D,el.dataset.blocks,el.value.split('\n').filter(function(x){return x.trim();}).map(function(line){var p=line.split('|').map(function(x){return x.trim();}),o={};ks.forEach(function(k,i){o[k]=i===ks.length-1?p.slice(i).join(' | '):(p[i]||'');});return o;}));touch();}
});
document.addEventListener('change',function(e){var el=e.target;
  if(el.dataset.wd!==undefined){var n=+el.dataset.wd,w=D.gift.weekend,i=w.indexOf(n);if(el.checked&&i<0)w.push(n);if(!el.checked&&i>=0)w.splice(i,1);touch();return;}
  if(el.type==='checkbox'&&el.dataset.b){setPath(D,el.dataset.b,el.checked);touch();}if(el.tagName==='SELECT'&&el.dataset.b){setPath(D,el.dataset.b,el.value);touch();}
  if(el.dataset.rr){if(tab==='dishes'){paintDishes();paintCats();}else if(tab==='banquet')paintSv();}
  if(el.id==='bkfile'){var bf=el.files&&el.files[0];if(!bf)return;var rd=new FileReader();rd.onload=function(){var nd;try{nd=JSON.parse(rd.result);}catch(er){return toast('Файл повреждён');}
    if(!nd||!nd.settings)return toast('Это не файл резервной копии сайта');if(!confirm('Заменить все данные сайта данными из файла?'))return;D=Store.normalize(nd);touch();toast('Данные восстановлены');render();};rd.readAsText(bf);}
});
document.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t)return;
  if(t.dataset.ost){oSt=t.dataset.ost;return paintOrders();}
  if(t.dataset.del){var did=t.dataset.del;if(!confirm('Удалить эту заявку? Её не будет в списке и в отчёте.'))return;var od=orders.filter(function(o){return String(o.id)===did;})[0];Store.setStatus(did,'deleted').then(function(){orders=orders.filter(function(o){return String(o.id)!==did;});if(od)afterStatus(od,'deleted');paintOrders();paintReport();toast('Удалено');}).catch(function(err){toast('Не вышло: '+err.message);});return;}
  if(t.dataset.bell||t.id==='bellBtn'){go('settings');setTimeout(function(){var c=$('#tgCard');if(c){c.scrollIntoView({behavior:'smooth',block:'center'});c.style.outline='2px solid #d6a74e';setTimeout(function(){c.style.outline='';},2500);}},300);return;}
  if(t.dataset.ord){var id=t.dataset.ord,s=t.dataset.s;Store.setStatus(id,s).then(function(){var ob=null;orders.forEach(function(o){if(String(o.id)===id){o.status=s;ob=o;}});if(ob)afterStatus(ob,s);paintOrders();}).catch(function(err){toast('Не вышло: '+err.message);});return;}
  if(t.dataset.cm){var y=+calM.slice(0,4),m=+calM.slice(5,7)-1+(+t.dataset.cm);var dt=new Date(Date.UTC(y,m,1));calM=dt.toISOString().slice(0,7);return paintCal();}
  if(t.dataset.day){var ds=t.dataset.day,on=D.busy.indexOf(ds)<0;setBusy(ds,on);toast(dnice(ds)+(on?' — занято':' — свободно'));return paintCal();}
  if(t.dataset.vdel){if(!confirm('Удалить это меню?'))return;D.corp.variants.splice(+t.dataset.vdel,1);touch();return vCorp();}
  if(t.id==='vadd'){D.corp.variants.push({price:0,poster:'',snacks:[],salads:[],hot:[]});touch();return vCorp();}
  if(t.dataset.pup){pIdx=+t.dataset.pup;$('#pfile').value='';$('#pfile').click();return;}
  if(t.dataset.pdel){var vv=D.corp.variants[+t.dataset.pdel],op=vv.poster;vv.poster='';touch();if(/^\d+$/.test(String(op)))Store.removeImg(op).catch(function(){});return vCorp();}
  if(t.id==='upl'){$('#files').value='';$('#files').click();return;}
  if(t.dataset.mv){var a=t.dataset.mv.split('|'),i=+a[0],j=i+(+a[1]);if(j<0||j>=D.photos.length)return;var x=D.photos[i];D.photos[i]=D.photos[j];D.photos[j]=x;touch();return vPhotos();}
  if(t.dataset.wdel){if(!confirm('Удалить фото с сайта?'))return;var w=D.photos.splice(+t.dataset.wdel,1)[0];touch();if(/^\d+$/.test(String(w.img)))Store.removeImg(w.img).catch(function(){});return vPhotos();}
  /* меню */
  if(t.dataset.dcat!==undefined){dCat=t.dataset.dcat;return paintDishes();}
  if(t.id==='dAdd'){var ds=D.dishes;if(dCat.charAt(0)==='_')dCat='all';dQ='';if($('#dq'))$('#dq').value='';
    ds.items.unshift({id:Store.uid(),n:'',d:'',w:'',p:0,img:'',cat:dCat!=='all'?dCat:(ds.cats[0]||''),hit:false,off:false,add:false});touch();paintDishes();paintCats();
    var ni=$('[data-b="dishes.items.0.n"]');if(ni){ni.focus();ni.scrollIntoView({block:'center'});}return;}
  if(t.dataset.dmv){var dm=t.dataset.dmv.split('|'),di=+dm[0],vis=dVisible().map(function(a){return a[1];}),pos=vis.indexOf(di),dj=vis[pos+(+dm[1])];if(dj==null)return;var it=D.dishes.items,tmp=it[di];it[di]=it[dj];it[dj]=tmp;touch();return paintDishes();}
  if(t.dataset.dcp){var ci2=+t.dataset.dcp,src=D.dishes.items[ci2],cp=JSON.parse(JSON.stringify(src));cp.id=Store.uid();cp.n=(src.n||'Блюдо')+' (копия)';D.dishes.items.splice(ci2+1,0,cp);touch();toast('Копия добавлена');return paintDishes();}
  if(t.dataset.ddel){var dx=D.dishes.items[+t.dataset.ddel];if(!confirm('Удалить блюдо «'+(dx.n||'без названия')+'»?'))return;D.dishes.items.splice(+t.dataset.ddel,1);touch();dropImg(dx.img);paintCats();return paintDishes();}
  if(t.dataset.dimg){dIdx=+t.dataset.dimg;$('#dfile').value='';$('#dfile').click();return;}
  if(t.dataset.cmv){var cm=t.dataset.cmv.split('|'),c1=+cm[0],c2=c1+(+cm[1]),cs=D.dishes.cats;if(c2<0||c2>=cs.length)return;var ct=cs[c1];cs[c1]=cs[c2];cs[c2]=ct;touch();paintCats();return paintDishes();}
  if(t.dataset.cdel){var cn=D.dishes.cats[+t.dataset.cdel],cc=D.dishes.items.filter(function(x){return x.cat===cn;}).length;if(cc)return toast('В разделе '+cc+' бл. — сначала перенесите или удалите их');if(!confirm('Удалить раздел «'+cn+'»?'))return;D.dishes.cats.splice(+t.dataset.cdel,1);touch();paintCats();return paintDishes();}
  if(t.id==='cAdd'){D.dishes.cats.push('Новый раздел');touch();paintCats();paintDishes();var cl=$('#cList').lastElementChild;if(cl){var cin=cl.querySelector('input');cin.focus();cin.select();}return;}
  if(t.id==='bpGo'){var pct=parseFloat(String($('#bpPct').value).replace(',','.')),rnd=+$('#bpRnd').value||1,bl=dVisible().filter(function(a){return a[0].p>0;});
    if(!pct)return toast('Укажите процент, например 10 или -5');if(!bl.length)return toast('В списке нет блюд с ценой');
    if(!confirm('Изменить цены у '+bl.length+' блюд на '+(pct>0?'+':'')+pct+'%?'))return;
    bl.forEach(function(a){a[0].p=Math.max(rnd,Math.round(a[0].p*(1+pct/100)/rnd)*rnd);});touch();toast('Цены изменены у '+bl.length+' блюд');return paintDishes();}
  /* банкет и услуги */
  if(t.id==='pkAdd'){D.banquet.packs.push({id:Store.uid(),n:'',p:0,min:0,items:[],note:'',off:false});touch();vBanquet();var pk=document.querySelectorAll('[data-b$=".n"][data-b^="banquet.packs."]');if(pk.length){pk[pk.length-1].focus();pk[pk.length-1].scrollIntoView({block:'center'});}return;}
  if(t.dataset.pmv){var pm=t.dataset.pmv.split('|'),p1=+pm[0],p2=p1+(+pm[1]),pl=D.banquet.packs;if(p2<0||p2>=pl.length)return;var pt=pl[p1];pl[p1]=pl[p2];pl[p2]=pt;touch();return vBanquet();}
  if(t.dataset.pkdel){var px=D.banquet.packs[+t.dataset.pkdel];if(!confirm('Удалить банкетное меню «'+(px.n||'без названия')+'»?'))return;D.banquet.packs.splice(+t.dataset.pkdel,1);touch();return vBanquet();}
  if(t.id==='svAdd'){D.services.push({id:Store.uid(),n:'',d:'',p:0,per:'fix',off:false});touch();paintSv();var sl=$('#svList').lastElementChild;if(sl)sl.querySelector('input').focus();return;}
  if(t.dataset.smv){var sm=t.dataset.smv.split('|'),s1=+sm[0],s2=s1+(+sm[1]),sv=D.services;if(s2<0||s2>=sv.length)return;var st=sv[s1];sv[s1]=sv[s2];sv[s2]=st;touch();return paintSv();}
  if(t.dataset.sdel){var sx=D.services[+t.dataset.sdel];if(!confirm('Удалить услугу «'+(sx.n||'без названия')+'»?'))return;D.services.splice(+t.dataset.sdel,1);touch();return paintSv();}
  /* смета */
  if(t.dataset.qx){var qa=t.dataset.qx.split('|'),qk=qa[0];Q.xq[qk]=Math.max(0,(+Q.xq[qk]||0)+(+qa[1]));if(!Q.xq[qk])delete Q.xq[qk];saveQ();return paintQ();}
  if(t.dataset.qt){var tk=t.dataset.qt;if(Q.xq[tk])delete Q.xq[tk];else Q.xq[tk]=1;saveQ();return paintQ();}
  if(t.dataset.qrm){delete Q.xq[t.dataset.qrm];saveQ();return paintQ();}
  if(t.id==='qWa'){var wn=waNum(Q.phone);window.open('https://wa.me/'+(wn.length>=11?wn:'')+'?text='+encodeURIComponent(qText()),'_blank','noopener');return;}
  if(t.id==='qCopy'){copyText(qText()).then(function(){toast('Смета скопирована');}).catch(function(){toast('Не удалось скопировать');});return;}
  if(t.id==='qPrint')return qPrint();
  if(t.id==='qClear'){if(!confirm('Очистить смету?'))return;Q=fixQ({guests:50});saveQ();return vQuote();}
  if(t.dataset.qo){var qo=orders.filter(function(o){return String(o.id)===t.dataset.qo;})[0];if(qo)quoteFrom(qo);return;}
  if(t.dataset.cq!==undefined){quoteFrom({name:t.dataset.cn,phone:t.dataset.cq});return;}
  /* клиенты и статистика */
  if(t.id==='cXls')return clientsXls();
  if(t.dataset.stp){stP=t.dataset.stp;return paintStats();}
  /* резервная копия */
  if(t.id==='bkDown'){download('emirat-копия-'+today()+'.json',JSON.stringify(D,null,1));toast('Копия скачана');return;}
  if(t.id==='bkUp'){$('#bkfile').value='';$('#bkfile').click();return;}
  if(t.id==='savePass'){var p1=$('#p1').value.trim(),p2=$('#p2').value.trim();if(p1.length<6)return toast('Минимум 6 символов');if(p1!==p2)return toast('Пароли не совпадают');if(/[а-яё]/i.test(p1))return toast('Только английские буквы и цифры');
    return Store.changePassword(p1).then(function(){toast('Пароль изменён, войдите заново');setTimeout(function(){Store.logout();location.reload();},1500);}).catch(function(err){toast('Не вышло: '+err.message);});}
  if(t.id==='reset'){if(!confirm('Заменить тексты, меню, фото и занятые даты версией из файла?'))return;return Store.reset().then(function(d){D=d;toast('Готово');render();}).catch(function(err){toast('Не вышло: '+err.message);});}
  if(t.id==='exit2'){Store.logout();location.reload();}
});
})();
</script>
</body>
</html>
